<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contactos | Agenda</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/contactos.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

    <header class="barra-superior">
        <h1>Agenda</h1>

        <div class="acciones-superior">

            <button id="btn-filtro-todos" class="btn-secundario activo" title="Todos">
                <i class="fa-solid fa-users"></i>
            </button>

            <button id="btn-filtro-favoritos" class="btn-secundario" title="Favoritos">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M305 151.1L320 171.8L335 151.1C360 116.5 400.2 96 442.9 96C516.4 96 576 155.6 576 229.1L576 231.7C576 343.9 436.1 474.2 363.1 529.9C350.7 539.3 335.5 544 320 544C304.5 544 289.2 539.4 276.9 529.9C203.9 474.2 64 343.9 64 231.7L64 229.1C64 155.6 123.6 96 197.1 96C239.8 96 280 116.5 305 151.1z"/></svg>
            </button>

            <button id="btn-nuevo-contacto" class="btn-principal" title="Nuevo contacto">
                <i class="fa-solid fa-plus"></i>
            </button>

            <button id="btn-perfil" class="btn-secundario" title="Mi perfil">
                <i class="fa-solid fa-user"></i>
            </button>

        </div>
    </header>

    <main class="contactos-contenedor">
        <section class="contactos-lista">

        </section>
    </main>


    <div class="modal" id="modal-perfil">
        <div class="modal-contenido perfil-cuadro">

            <button class="modal-cerrar" id="cerrar-perfil" aria-label="Cerrar">
                x
            </button>

            <h2 class="perfil-titulo">Mi perfil</h2>

            <div class="perfil-info">
                <div class="perfil-item">
                    <span class="perfil-etiqueta">Correo electrónico</span>
                    <span id="perfil-correo" class="perfil-valor"></span>
                </div>

                <div class="perfil-item">
                    <span class="perfil-etiqueta">Contraseña</span>
                    <span id="perfil-password" class="perfil-valor"></span>
                </div>
            </div>

        </div>
    </div>



    <script src="../js/storage.js"></script>
    <script src="../js/contacto.js"></script>

</body>

</html>

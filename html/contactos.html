<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contactos | Agenda</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/contactos.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

    <header class="barra-superior">
        <h1>Agenda</h1>

        <div class="acciones-superior">

            <button id="btn-filtro-todos" class="btn-secundario activo" title="Todos">
                <i class="fa-solid fa-users"></i>
            </button>

            <button id="btn-filtro-favoritos" class="btn-secundario" title="Favoritos">
                <i class="fa-solid fa-heart"></i>
            </button>
            <button id="btn-nuevo-contacto" class="btn-principal" title="Nuevo contacto">
                <i class="fa-solid fa-plus"></i>
            </button>

            <button id="btn-perfil" class="btn-secundario" title="Mi perfil">
                <i class="fa-solid fa-user"></i>
            </button>

            <a href="../index.html" class="btn-secundario" title="Tareas">
                <i class="fa-solid fa-clipboard-list"></i>
            </a>
        </div>
    </header>

    <main class="contactos-contenedor">
        <section class="contactos-lista">

        </section>
    </main>


    <div class="modal" id="modal-perfil">
        <div class="modal-contenido perfil-cuadro">

            <button class="modal-cerrar" id="cerrar-perfil" aria-label="Cerrar">
                x
            </button>

            <h2 class="perfil-titulo">Mi perfil</h2>

            <div class="perfil-info">
                <div class="perfil-item">
                    <span class="perfil-etiqueta">Correo electrónico</span>
                    <span id="perfil-correo" class="perfil-valor"></span>
                </div>

                <div class="perfil-item">
                    <span class="perfil-etiqueta">Contraseña</span>
                    <span id="perfil-password" class="perfil-valor"></span>
                </div>
            </div>

        </div>
    </div>

    <div class="modal" id="modal-detalle">
        <div class="modal-contenido detalle-cuadro">

            <button class="modal-cerrar" id="cerrar-detalle">x</button>

            <h2>Detalle del contacto</h2>

            <div class="detalle-info">
                <p><strong>Nombre:</strong> <span id="detalle-nombre"></span></p>
                <p><strong>Teléfono:</strong> <span id="detalle-telefono"></span></p>
                <p><strong>Correo:</strong> <span id="detalle-correo"></span></p>
                <p><strong>Favorito:</strong> <span id="detalle-favorito"></span></p>
            </div>

        </div>
    </div>


    <div class="modal" id="modal-nuevo-contacto">
        <div class="modal-contenido nuevo-contacto-cuadro">

            <button class="modal-cerrar" id="cerrar-nuevo-contacto">x</button>

            <h2>Nuevo contacto</h2>

            <form class="form-nuevo-contacto">
                <div class="campo-form">
                    <label>Nombre</label>
                    <input type="text" placeholder="Nombre completo">
                </div>

                <div class="campo-form">
                    <label>Teléfono</label>
                    <input type="tel" placeholder="1234-5678">
                </div>

                <div class="campo-form">
                    <label>Correo</label>
                    <input type="email" placeholder="correo@ejemplo.com">
                </div>

                <div class="acciones-form">
                    <button type="button" class="btn-secundario" id="cancelar-nuevo-contacto">
                        Cancelar
                    </button>
                    <button type="button" class="btn-principal">
                        Guardar
                    </button>
                </div>
            </form>

        </div>
    </div>



    <script src="../js/storage.js"></script>
    <script src="../js/contacto.js"></script>

</body>

</html>

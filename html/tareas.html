<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tareas | Agenda</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/tareas.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

    <header class="barra-superior">
        <h1>Tareas</h1>
        <div class="acciones-superior">
            <a href="contactos.html" class="btn-secundario">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <button id="btn-nueva-tarea" class="btn-principal">+</button>
        </div>
    </header>

    <main class="tareas-contenedor">
        <section class="tareas-lista"></section>
    </main>


    <div class="modal" id="modal-nueva-tarea">
        <div class="modal-contenido tarea-cuadro">

            <button class="modal-cerrar" id="cerrar-nueva-tarea">×</button>

            <h2 id="titulo-modal">Nueva tarea</h2>

            <form id="form-tarea">

                <label>Título</label>
                <input type="text" id="tarea-titulo" required>

                <label>Descripción</label>
                <textarea id="tarea-descripcion" rows="3"></textarea>

                <label>Prioridad</label>
                <select id="tarea-prioridad">
                    <option value="alta">Alta</option>
                    <option value="media">Media</option>
                    <option value="baja">Baja</option>
                </select>

                <button type="submit" class="btn-principal" id="guardar-tarea">Guardar</button>
            </form>

        </div>
    </div>


    <script src="../js/tareas.js"></script>

</body>

</html>
